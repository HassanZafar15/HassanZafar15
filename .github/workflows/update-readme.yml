name: Update Profile SVG Cards

on:
  schedule:
    - cron: "0 2 * * *" # 07:00 AM PKT daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch full contribution stats
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python scripts/fetch_contributions.py

      - name: Render animated SVG cards
        run: python scripts/render_readme_cards.py

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json cards/
          git diff --staged --quiet || git commit -m "chore: refresh README SVG cards"
          git push
