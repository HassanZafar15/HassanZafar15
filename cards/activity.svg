<svg xmlns="http://www.w3.org/2000/svg" width="880" height="238" viewBox="0 0 880 238" role="img" aria-label="Monthly contributions">
  <style>

    .eyebrow { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; letter-spacing: 0.1em; fill: #6B655D; }
    .stat-v { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 30px; fill: #171614; }
    .stat-k { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; letter-spacing: 0.08em; fill: #9A9389; }
    .m-lbl { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; fill: #6B655D; }
    .peak-v { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; font-weight: 700; fill: #2255D4; }
    @keyframes growUp {
      from { transform: scaleY(0); opacity: 0.2; }
      to { transform: scaleY(1); opacity: 1; }
    }
    @keyframes popIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .bar { transform-box: fill-box; transform-origin: center bottom; transform: scaleY(0);
            animation: growUp 0.55s cubic-bezier(0.22,1,0.36,1) forwards; }
    .pop-in { opacity: 0; animation: popIn 0.35s ease-out forwards; }
    

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      .smil-count { display: none !important; }
      .smil-static { display: inline !important; visibility: visible !important; }
    }
    
</style>
  <rect x="0.5" y="0.5" width="879" height="237" rx="14" fill="#F6F3EC" stroke="#DDD6C7" />
  <text x="32" y="30" class="eyebrow">MONTHLY BREAKDOWN &amp; STREAKS</text>
  <text x="32" y="58" class="stat-k">TOTAL (12M)</text><text x="32" y="86" class="stat-v">310</text><text x="197" y="58" class="stat-k">ACTIVE DAYS</text><text x="197" y="86" class="stat-v">85</text><text x="362" y="58" class="stat-k">CURRENT STREAK</text><text x="362" y="86" class="stat-v">1d</text><text x="527" y="58" class="stat-k">LONGEST STREAK</text><text x="527" y="86" class="stat-v">5d</text><text x="692" y="58" class="stat-k">BUSIEST DAY</text><text x="692" y="86" class="stat-v">24 (Sep 01)</text>
