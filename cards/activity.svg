le="animation-delay:0.85s">64</text><rect x="715.2" y="148.2" width="48" height="53.8" rx="5" fill="#D4CCBD" class="bar" style="animation-delay:0.530s" /><text x="739.2" y="220" text-anchor="middle" class="m-lbl">OCT</text><rect x="781.8" y="181.0" width="48" height="21.0" rx="5" fill="#D4CCBD" class="bar" style="animation-delay:0.555s" /><text x="805.8" y="220" text-anchor="middle" class="m-lbl">NOV</text>
