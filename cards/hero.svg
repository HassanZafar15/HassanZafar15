<svg xmlns="http://www.w3.org/2000/svg" width="880" height="232" viewBox="0 0 880 232" role="img" aria-label="Hassan Zafar — Senior Flutter Developer">
  <defs>
    <linearGradient id="nameShine" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#171614" />
      <stop offset="38%" stop-color="#171614" />
      <stop offset="50%" stop-color="#2255D4" />
      <stop offset="62%" stop-color="#171614" />
      <stop offset="100%" stop-color="#171614" />
      
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1.6 0; 2.2 0; 2.2 0" keyTimes="0; 0.32; 1"
        dur="5.2s" begin="1.1s" repeatCount="indefinite" />
    
    </linearGradient>
  </defs>
  <style>

    .eyebrow { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; letter-spacing: 0.1em; fill: #6B655D; }
    .eyebrow-status { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10.5px; letter-spacing: 0.1em; fill: #1F8A5B; }
    .name { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 64px; font-weight: 400; letter-spacing: -0.015em; }
    .role { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 15.5px; font-weight: 500; fill: #171614; }
    .bio { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13.5px; fill: #6B655D; }
    .pill-txt { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; letter-spacing: 0.06em; fill: #6B655D; }
    .ledger-k { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9px; letter-spacing: 0.07em; fill: #9A9389; }
    .ledger-v { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 20px; fill: #171614; }
    .ascii { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 3.1px; fill: #171614; white-space: pre; }
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.9); opacity: 0; }
    }
    @keyframes rowFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .rise { opacity: 0; animation: riseIn 0.55s cubic-bezier(0.22,1,0.36,1) forwards; }
    .dot-ring { transform-box: fill-box; transform-origin: center; animation: pulseDot 2.4s ease-out infinite; }
    .row-in { opacity: 0; animation: rowFade 0.25s ease-out forwards; }
    

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      .smil-count { display: none !important; }
      .smil-static { display: inline !important; visibility: visible !important; }
    }
    
</style>
  <rect x="0.5" y="0.5" width="879" height="231" rx="14" fill="#F6F3EC" stroke="#DDD6C7" />

  <!-- Top eyebrow & pulsing status -->
  <g class="rise" style="animation-delay:0.05s">
    <text x="36" y="38" class="eyebrow">ISLAMABAD, PK · PKT (UTC+5)</text>
    <circle cx="256" cy="34.5" r="3.5" fill="#1F8A5B" class="dot-ring" />
    <circle cx="256" cy="34.5" r="3.5" fill="#1F8A5B" />
    <text x="267" y="38" class="eyebrow-status">OPEN TO REMOTE &amp; FREELANCE</text>
  </g>

  <!-- Editorial serif name -->
  <text x="36" y="106" class="name rise" style="animation-delay:0.14s" fill="#171614">Hassan <tspan fill="url(#nameShine)">Zafar</tspan></text>

  <!-- Bio lines -->
  <text x="36" y="140" class="role rise" style="animation-delay:0.26s">Senior Flutter Developer at Abacus Consulting</text>
  <text x="36" y="164" class="bio rise" style="animation-delay:0.34s">5+ years shipping cross-platform mobile &amp; web apps to millions of users.</text>

  <!-- Bottom tags -->
  
        <g class="rise" style="animation-delay:0.42s">
          <rect x="36" y="186" width="111.6" height="24" rx="5" fill="#EFEAE0" stroke="#DDD6C7" />
          <text x="91.8" y="201.5" text-anchor="middle" class="pill-txt">FLUTTER &amp; DART</text>
        </g>
        
        <g class="rise" style="animation-delay:0.49s">
          <rect x="155.60000000000002" y="186" width="143.6" height="24" rx="5" fill="#EFEAE0" stroke="#DDD6C7" />
          <text x="227.4" y="201.5" text-anchor="middle" class="pill-txt">IOS · ANDROID · WEB</text>
        </g>
        
        <g class="rise" style="animation-delay:0.56s">
          <rect x="307.20000000000005" y="186" width="169.2" height="24" rx="5" fill="#EFEAE0" stroke="#DDD6C7" />
          <text x="391.8" y="201.5" text-anchor="middle" class="pill-txt">BLOC · RIVERPOD · CI/CD</text>
        </g>
        

  <!-- Right editorial ledger or ASCII portrait -->
  <rect x="612" y="22" width="244" height="188" rx="10" fill="#EFEAE0" stroke="#DDD6C7" />
<text x="630" y="44" class="eyebrow">ACTIVITY LEDGER</text>
<line x1="630" y1="53" x2="838" y2="53" stroke="#DDD6C7" />

            <g class="row-in" style="animation-delay:0.30s">
              <text x="630" y="82" class="ledger-k">CONTRIBUTIONS</text>
              <text x="630" y="107" class="ledger-v">310</text>
            </g>
            

            <g class="row-in" style="animation-delay:0.39s">
              <text x="738" y="82" class="ledger-k">ACTIVE DAYS</text>
              <text x="738" y="107" class="ledger-v">85</text>
            </g>
            

            <g class="row-in" style="animation-delay:0.48s">
              <text x="630" y="146" class="ledger-k">LONGEST STREAK</text>
              <text x="630" y="171" class="ledger-v">5 days</text>
            </g>
            

            <g class="row-in" style="animation-delay:0.57s">
              <text x="738" y="146" class="ledger-k">PEAK DAY</text>
              <text x="738" y="171" class="ledger-v">24 commits</text>
            </g>
            
</svg>
