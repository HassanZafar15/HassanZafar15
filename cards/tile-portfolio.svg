<svg xmlns="http://www.w3.org/2000/svg" width="286" height="192" viewBox="0 0 286 192" role="img" aria-label="PORTFOLIO">
  <defs>
    <clipPath id="tileClip"><rect x="0" y="0" width="286" height="192" rx="14" /></clipPath>
    <linearGradient id="tileShine" x1="0%" y1="0%" x2="100%" y2="35%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="44%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.22" />
      <stop offset="56%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
      
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-1.4 0; 2.4 0; 2.4 0" keyTimes="0; 0.25; 1"
        dur="5.8s" begin="2.90s" repeatCount="indefinite" />
    
    </linearGradient>
  </defs>
  <style>

    .eyebrow { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; letter-spacing: 0.12em; fill: #F6F3EC; opacity: 0.82; }
    .big-num { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 62px; fill: #FFFFFF; }
    .unit { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; letter-spacing: 0.1em; fill: #F6F3EC; opacity: 0.85; }
    .sub { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12.5px; fill: #F6F3EC; opacity: 0.92; }
    .cta { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; letter-spacing: 0.08em; fill: #FFFFFF; }
    @keyframes tileSwing {
      0% { opacity: 0; transform: translateY(22px) rotate(-2.5deg) scale(0.96); }
      70% { opacity: 1; transform: translateY(-3px) rotate(0.5deg) scale(1.01); }
      100% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
    }
    @keyframes ringPulse {
      0% { transform: scale(0.8); opacity: 0.45; }
      100% { transform: scale(2.1); opacity: 0; }
    }
    @keyframes nudgeArrow {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(3px, -2px); }
    }
    .tile-wrap {
      opacity: 0; transform-box: fill-box; transform-origin: center;
      animation: tileSwing 0.65s cubic-bezier(0.22,1,0.36,1) 1.50s forwards;
    }
    .corner-ring {
      transform-box: fill-box; transform-origin: center;
      animation: ringPulse 3.2s ease-out 2.10s infinite;
    }
    .arrow {
      display: inline-block;
      animation: nudgeArrow 2.2s ease-in-out 2.40s infinite;
    }
    

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      .smil-count { display: none !important; }
      .smil-static { display: inline !important; visibility: visible !important; }
    }
    
</style>
  <g class="tile-wrap">
    <g clip-path="url(#tileClip)">
      <rect x="0" y="0" width="286" height="192" rx="14" fill="#C83E2B" />
      <circle cx="264" cy="24" r="18" fill="none" stroke="#FFFFFF" stroke-width="1.2" class="corner-ring" />
      <circle cx="264" cy="24" r="4" fill="#FFFFFF" opacity="0.85" />
      <rect x="0" y="0" width="286" height="192" fill="url(#tileShine)" />
    </g>
    <text x="24" y="34" class="eyebrow">PORTFOLIO</text>
    <text x="24" y="98" class="big-num smil-static" style="display:none">10+</text>
<text x="24" y="98" class="big-num smil-count" visibility="hidden">0<set attributeName="visibility" to="visible" begin="1.750s" end="1.795s" /></text>
<text x="24" y="98" class="big-num smil-count" visibility="hidden">1+<set attributeName="visibility" to="visible" begin="1.795s" end="1.840s" /></text>
<text x="24" y="98" class="big-num smil-count" visibility="hidden">1+<set attributeName="visibility" to="visible" begin="1.840s" end="1.885s" /></text>
<text x="24" y="98" class="big-num smil-count" visibility="hidden">2+<set attributeName="visibility" to="visible" begin="1.885s" end="1.930s" /></text>
<text x="24" y="98" class="big-num smil-count" visibility="hidden">2+<set attributeName="visibility" to="visible" begin="1.930s" end="1.975s" /></text>
<text x="24" y="98" class="big-num smil-count" visibility="hidden">3+<set attributeName="visibility" to="visible" begin="1.975s" end="2.020s" /></text>
<text x="24" y="98" class="big-num smil-count" visibility="hidden">4+<set attributeName="visibility" to="visible" begin="2.020s" end="2.065s" /></text>
<text x="24" y="98" class="big-num smil-count" visibility="hidden">4+<set attributeName="visibility" to="visible" begin="2.065s" end="2.110s" /></text>
<text x="24" y="98" class="big-num smil-count" visibility="hidden">5+<set attributeName="visibility" to="visible" begin="2.110s" end="2.155s" /></text>
<text x="24" y="98" class="big-num smil-count" visibility="hidden">5+<set attributeName="visibility" to="visible" begin="2.155s" end="2.200s" /></text>
<text x="24" y="98" class="big-num smil-count" visibility="hidden">6+<set attributeName="visibility" to="visible" begin="2.200s" end="2.245s" /></text>
<text x="24" y="98" class="big-num smil-count" visibility="hidden">6+<set attributeName="visibility" to="visible" begin="2.245s" end="2.290s" /></text>
<text x="24" y="98" class="big-num smil-count" visibility="hidden">7+<set attributeName="visibility" to="visible" begin="2.290s" end="2.335s" /></text>
<text x="24" y="98" class="big-num smil-count" visibility="hidden">8+<set attributeName="visibility" to="visible" begin="2.335s" end="2.380s" /></text>
<text x="24" y="98" class="big-num smil-count" visibility="hidden">8+<set attributeName="visibility" to="visible" begin="2.380s" end="2.425s" /></text>
<text x="24" y="98" class="big-num smil-count" visibility="hidden">9+<set attributeName="visibility" to="visible" begin="2.425s" end="2.470s" /></text>
<text x="24" y="98" class="big-num smil-count" visibility="hidden">9+<set attributeName="visibility" to="visible" begin="2.470s" end="2.515s" /></text>
<text x="24" y="98" class="big-num smil-count" visibility="hidden">10+<set attributeName="visibility" to="visible" begin="2.515s" fill="freeze" /></text>
    <text x="24" y="123" class="unit">SHIPPED APPS</text>
    <text x="24" y="147" class="sub">GovTech · SaaS · eSIM · Health</text>
    <line x1="24" y1="160" x2="262" y2="160" stroke="#FFFFFF" stroke-opacity="0.24" />
    <text x="24" y="178" class="cta">HASSANZAFAR.NETLIFY.APP</text>
    <text x="262" y="178" text-anchor="end" class="cta arrow">↗</text>
  </g>
</svg>
