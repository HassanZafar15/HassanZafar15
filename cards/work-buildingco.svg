<svg xmlns="http://www.w3.org/2000/svg" width="432" height="190" viewBox="0 0 432 190" role="img" aria-label="09 Building Co">
  <style>

    .cat { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; letter-spacing: 0.1em; fill: #B88212; }
    .title { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 29px; fill: #171614; }
    .desc { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12.5px; fill: #6B655D; }
    .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; fill: #6B655D; }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .rise { opacity: 0; animation: cardIn 0.5s cubic-bezier(0.22,1,0.36,1) 0.90s forwards; }
    

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      .smil-count { display: none !important; }
      .smil-static { display: inline !important; visibility: visible !important; }
    }
    
</style>
  <g class="rise">
    <rect x="0.5" y="0.5" width="431" height="189" rx="14" fill="#F6F3EC" stroke="#DDD6C7" />
    <rect x="24" y="0.5" width="44" height="3.5" rx="1.75" fill="#B88212" />
    <text x="24" y="32" class="cat">CONSTRUCTION · FIELD OPS</text>
    <text x="24" y="66" class="title">09 Building Co</text>
    <text x="24" y="94" class="desc">Operations app for construction teams featuring job</text>
<text x="24" y="112" class="desc">assignment, project tracking, employee workflows, PDF</text>
<text x="24" y="130" class="desc">handoffs, and completion photos.</text>
    <rect x="24" y="152" width="92.4" height="22" rx="5" fill="#EFEAE0" stroke="#DDD6C7" /><text x="70.2" y="166.5" text-anchor="middle" class="tag">Construction</text><rect x="123.4" y="152" width="73.8" height="22" rx="5" fill="#EFEAE0" stroke="#DDD6C7" /><text x="160.3" y="166.5" text-anchor="middle" class="tag">Field Ops</text><rect x="204.20000000000002" y="152" width="98.6" height="22" rx="5" fill="#EFEAE0" stroke="#DDD6C7" /><text x="253.5" y="166.5" text-anchor="middle" class="tag">iOS &amp; Android</text>
  </g>
</svg>
