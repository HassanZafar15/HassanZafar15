<svg xmlns="http://www.w3.org/2000/svg" width="432" height="190" viewBox="0 0 432 190" role="img" aria-label="Surrey Security Staff">
  <style>

    .cat { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; letter-spacing: 0.1em; fill: #171614; }
    .title { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 29px; fill: #171614; }
    .desc { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12.5px; fill: #6B655D; }
    .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; fill: #6B655D; }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .rise { opacity: 0; animation: cardIn 0.5s cubic-bezier(0.22,1,0.36,1) 0.85s forwards; }
    

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      .smil-count { display: none !important; }
      .smil-static { display: inline !important; visibility: visible !important; }
    }
    
</style>
  <g class="rise">
    <rect x="0.5" y="0.5" width="431" height="189" rx="14" fill="#F6F3EC" stroke="#DDD6C7" />
    <rect x="24" y="0.5" width="44" height="3.5" rx="1.75" fill="#171614" />
    <text x="24" y="32" class="cat">ENTERPRISE WORKFORCE</text>
    <text x="24" y="66" class="title">Surrey Security Staff</text>
    <text x="24" y="94" class="desc">Enterprise-grade staff coordination system for large-</text>
<text x="24" y="112" class="desc">scale security operations, compliance, workforce</text>
<text x="24" y="130" class="desc">scheduling, live shift tools, and reporting.</text>
    <rect x="24" y="152" width="73.8" height="22" rx="5" fill="#EFEAE0" stroke="#DDD6C7" /><text x="60.9" y="166.5" text-anchor="middle" class="tag">Workforce</text><rect x="104.80000000000001" y="152" width="80.0" height="22" rx="5" fill="#EFEAE0" stroke="#DDD6C7" /><text x="144.8" y="166.5" text-anchor="middle" class="tag">Compliance</text><rect x="191.8" y="152" width="98.6" height="22" rx="5" fill="#EFEAE0" stroke="#DDD6C7" /><text x="241.1" y="166.5" text-anchor="middle" class="tag">iOS &amp; Android</text>
  </g>
</svg>
