<svg xmlns="http://www.w3.org/2000/svg" width="432" height="190" viewBox="0 0 432 190" role="img" aria-label="Tjwalnet — Travel eSIM">
  <style>

    .cat { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; letter-spacing: 0.1em; fill: #2255D4; }
    .title { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 29px; fill: #171614; }
    .desc { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12.5px; fill: #6B655D; }
    .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; fill: #6B655D; }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .rise { opacity: 0; animation: cardIn 0.5s cubic-bezier(0.22,1,0.36,1) 0.65s forwards; }
    

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
        opacity: 1 !important;
        transform: none !important;
      }
      .smil-count { display: none !important; }
      .smil-static { display: inline !important; visibility: visible !important; }
    }
    
</style>
  <g class="rise">
    <rect x="0.5" y="0.5" width="431" height="189" rx="14" fill="#F6F3EC" stroke="#DDD6C7" />
    <rect x="24" y="0.5" width="44" height="3.5" rx="1.75" fill="#2255D4" />
    <text x="24" y="32" class="cat">TRAVEL &amp; TELECOM</text>
    <text x="24" y="66" class="title">Tjwalnet — Travel eSIM</text>
    <text x="24" y="94" class="desc">Region-aware eSIM system covering 70+ countries with</text>
<text x="24" y="112" class="desc">in-app wallet and points-based payments. Handles</text>
<text x="24" y="130" class="desc">complex telecom logic seamlessly.</text>
    <rect x="24" y="152" width="61.4" height="22" rx="5" fill="#EFEAE0" stroke="#DDD6C7" /><text x="54.7" y="166.5" text-anchor="middle" class="tag">Flutter</text><rect x="92.4" y="152" width="67.6" height="22" rx="5" fill="#EFEAE0" stroke="#DDD6C7" /><text x="126.2" y="166.5" text-anchor="middle" class="tag">Firebase</text><rect x="167.0" y="152" width="55.2" height="22" rx="5" fill="#EFEAE0" stroke="#DDD6C7" /><text x="194.6" y="166.5" text-anchor="middle" class="tag">PayPal</text><rect x="229.2" y="152" width="98.6" height="22" rx="5" fill="#EFEAE0" stroke="#DDD6C7" /><text x="278.5" y="166.5" text-anchor="middle" class="tag">iOS &amp; Android</text>
  </g>
</svg>
